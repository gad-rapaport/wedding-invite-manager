{% extends "base.html" %}
{% block title %}הגדרות אירוע{% endblock %}

{% block content %}
<h1 class="page-title">⚙️ הגדרות אירוע</h1>

<form method="POST" enctype="multipart/form-data" class="form-card">
  <div class="form-row">
    <div class="form-group">
      <label for="bride_name">שם הכלה *</label>
      <input type="text" id="bride_name" name="bride_name" required
             value="{{ event.bride_name if event else '' }}" />
    </div>
    <div class="form-group">
      <label for="groom_name">שם החתן *</label>
      <input type="text" id="groom_name" name="groom_name" required
             value="{{ event.groom_name if event else '' }}" />
    </div>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label for="wedding_date">תאריך ושעת החתונה *</label>
      <input type="datetime-local" id="wedding_date" name="wedding_date" required
             value="{{ event.wedding_date.strftime('%Y-%m-%dT%H:%M') if event and event.wedding_date else '' }}" />
    </div>
    <div class="form-group">
      <label for="reminder_days_before">שלח תזכורת X ימים לפני</label>
      <input type="number" id="reminder_days_before" name="reminder_days_before" min="1" max="30"
             value="{{ event.reminder_days_before if event else 7 }}" />
    </div>
  </div>
  <div class="form-group">
    <label for="venue">שם האולם</label>
    <input type="text" id="venue" name="venue"
           value="{{ event.venue if event else '' }}" />
  </div>
  <div class="form-group">
    <label for="venue_address">כתובת האולם</label>
    <textarea id="venue_address" name="venue_address" rows="2">{{ event.venue_address if event else '' }}</textarea>
  </div>
  <div class="form-group">
    <label for="invitation_image">תמונת ההזמנה (PNG/JPG)</label>
    {% if event and event.invitation_image_path %}
      <img src="{{ event.invitation_image_path }}" alt="הזמנה" class="preview-image" />
    {% endif %}
    <input type="file" id="invitation_image" name="invitation_image" accept="image/*" />
  </div>
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">שמור הגדרות</button>
  </div>
</form>
{% endblock %}
