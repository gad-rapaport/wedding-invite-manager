<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}ניהול הזמנות חתונה{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">💍 מנהל הזמנות חתונה</div>
    <ul class="nav-links">
      <li><a href="{{ url_for('ui.dashboard') }}" {% if request.endpoint == 'ui.dashboard' %}class="active"{% endif %}>דשבורד</a></li>
      <li><a href="{{ url_for('ui.guests') }}" {% if 'guest' in request.endpoint %}class="active"{% endif %}>אורחים</a></li>
      <li><a href="{{ url_for('ui.send_page') }}" {% if request.endpoint == 'ui.send_page' %}class="active"{% endif %}>שליחת הזמנות</a></li>
      <li><a href="{{ url_for('ui.event_settings') }}" {% if request.endpoint == 'ui.event_settings' %}class="active"{% endif %}>הגדרות אירוע</a></li>
    </ul>
  </nav>

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <p>Wedding Invite Manager &copy; 2025</p>
  </footer>
</body>
</html>
