name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  IMAGE_NAME: wedding-invite-manager

jobs:
  # ── Stage 1: Test ──────────────────────────────────────────────────────────
  test:
    name: Run pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: PYTHONPATH=. pytest tests/ -v

      - name: Send failure email
        if: failure()
        continue-on-error: true          # אם ה-MAIL secrets לא מוגדרים — לא קורס
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "CI failed — ${{ github.repository }} @ ${{ github.ref_name }}"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            Pipeline failed on commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Pushed by: ${{ github.actor }}
            Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # ── Stage 2: Build & Push Docker image ────────────────────────────────────
  build-and-push:
    name: Build & Push to Docker Hub
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ── Stage 3: Deploy to Hetzner ────────────────────────────────────────────
  deploy:
    name: Deploy to Hetzner
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            # Clone project if first deploy
            if [ ! -d /root/wedding-invite-manager ]; then
              git clone https://github.com/${{ github.repository }} /root/wedding-invite-manager
            fi

            cd /root/wedding-invite-manager

            # Pull latest code
            git pull origin main

            # Pull latest Docker image
            docker pull ${{ secrets.DOCKER_USERNAME }}/wedding-invite-manager:latest

            # docker compose v2 (plugin) — fallback to docker-compose v1
            if docker compose version &>/dev/null 2>&1; then
              docker compose pull
              docker compose up -d --no-deps app
            else
              docker-compose pull
              docker-compose up -d --no-deps app
            fi

            echo "Deployed successfully at $(date)"
